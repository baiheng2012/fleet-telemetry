[project]
name = "fleet-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "psycopg[binary]>=3.1",
    "dbt-postgres>=1.8,<2",
    "pandas>=2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
